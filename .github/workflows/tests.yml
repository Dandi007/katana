name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  memory-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: memory hook fallback + kimi prompt hook regressions
        # scan-memory 已随 memory MCP 化（#65）退役；现测 hook 降级路径与 kimi hook
        run: |
          bash plugins/memory/tests/session-start.test.sh
          bash plugins/memory/tests/kimi-user-prompt-hook.test.sh

  pack-parity:
    # Guards the "published artifact is missing runtime assets" failure class:
    # packs the real npm tarball and runs the hooks FROM the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: packed-artifact injection parity
        run: bash tests/pack-parity.sh

  adapter-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: OpenCode parity adapter unit tests
        run: bun test parity/adapter/opencode/

  mcp-unit:
    # Gates the MCP servers (katana-wiki-mcp + katana-work-folder-mcp): L0 单元 +
    # 全状态图集成回归（create/save/resume MATCH/DRIFT/BROKEN/list/search）。
    # 无 svc / 无 LLM / 无网络；把原先只能手跑的 live e2e 固化成确定性 merge gate。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: install mcp packages + run unit/integration tests
        run: |
          uv venv
          uv pip install -e mcp/shared -e mcp/kernel -e mcp/memory -e mcp/wiki -e mcp/work-folder pytest
          PYTHON=.venv/bin/python bash mcp/run-tests.sh
