name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  memory-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: memory shell regressions (current MCP/runtime paths)
        run: |
          bash plugins/memory/tests/session-start.test.sh
          bash plugins/memory/tests/kimi-user-prompt-hook.test.sh

  pack-parity:
    # Guards the "published artifact is missing runtime assets" failure class:
    # packs the real npm tarball and runs the hooks FROM the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: packed-artifact injection parity
        run: bash tests/pack-parity.sh

  adapter-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: OpenCode parity adapter unit tests
        run: bun test parity/adapter/opencode/

  mcp-unit:
    # Gates the MCP servers (katana-wiki-mcp + katana-work-folder-mcp +
    # katana-memory-mcp): L0 单元 + 全状态图集成回归（create/save/resume
    # MATCH/DRIFT/BROKEN/list/search，memory CRUD/index/migrate）。
    # 无 svc / 无 LLM / 无网络；把原先只能手跑的 live e2e 固化成确定性 merge gate。
    # clean venv 必须安装 run-tests.sh 实际执行的全部 MCP 包（含 memory），
    # 否则 mcp/memory/tests 因缺 fastmcp / katana_memory_mcp import 而报错。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: install mcp packages + run unit/integration tests
        run: |
          uv venv
          uv pip install -e mcp/shared -e mcp/wiki -e mcp/work-folder -e mcp/memory pytest
          PYTHON=.venv/bin/python bash mcp/run-tests.sh
