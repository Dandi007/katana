name: Publish to npm

on:
  push:
    tags: ['oc-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release creates the GitHub Release
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Quality gates (bun test / G0 lint / e2e) run on the PR via the contract
      # harness; they need bun+uv+claude and are not part of the npm publish.
      # This package has zero runtime deps, so there is nothing to install.

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME#oc-v}
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PKG_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
