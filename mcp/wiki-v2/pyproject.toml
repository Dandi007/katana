[project]
name = "katana-wiki-v2-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.2.4,<4", "httpx>=0.27", "pyyaml>=6", "lancedb"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
katana-wiki-v2-mcp = "katana_wiki_v2_mcp.server:main"
katana-wiki-v2-migrate = "katana_wiki_v2_mcp.migrate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"