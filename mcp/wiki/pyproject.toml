[project]
name = "katana-wiki-mcp"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.2.4,<4", "httpx>=0.27", "katana-kb-mcp-shared", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
katana-wiki-mcp = "katana_wiki_mcp.server:main"
katana-wiki-cli = "katana_wiki_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
