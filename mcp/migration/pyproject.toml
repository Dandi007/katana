[project]
name = "katana-migration"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["katana-kernel", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
migration-inventory = "katana_migration.inventory:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"