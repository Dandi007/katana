[project]
name = "katana-work-folder-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.2.4,<4", "httpx>=0.27", "katana-kb-mcp-shared", "katana-kernel", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
katana-work-folder-mcp = "katana_work_folder_mcp.server:main"
wf-lint = "katana_work_folder_mcp.brief:main"
wf-touch = "katana_work_folder_mcp.brief_ops:main"
wf-reindex = "katana_work_folder_mcp.reindex:main"
wf-report = "katana_work_folder_mcp.report:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
