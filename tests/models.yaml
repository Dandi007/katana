# 测试模型配置。setter 仅供 env（base_url/betas/auth），model 一律显式（G5）。
semantic_judge: single        # single | jury
roles:
  default-judge: {setter: set_claude_gateway_model, model: glm-5.3}
  contract:      {setter: set_claude_gateway_model, model: glm-5.3}
jury-roster:
  - {name: opus,     setter: set_claude_native_opus,  model: opus}
  - {name: kimi,     setter: set_claude_gateway_model, model: k3}
  - {name: deepseek, setter: set_claude_gateway_model, model: deepseek-v4-pro}
  - {name: qwen,     setter: set_claude_gateway_model, model: qwen3.8-max}
