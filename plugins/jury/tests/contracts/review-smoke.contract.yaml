skill: jury:review
setup:
  fixture: kb
  requires:
    - cmd:claude
    - env:KATANA_E2E_JURY        # 门控：仅有本机订阅(Opus 原生)+ccs 时真跑
trigger:
  prompt: |
    在当前目录执行以下步骤（用 Bash）：
    1. 在当前目录下新建子目录 `scratch/`，在 scratch/ 里 git init；写文件 calc.py 内含函数 add(a,b) 正确实现，git commit。
    2. 改 scratch/calc.py：把 add 改成 `return a - b`（引入明显 bug），git commit。
    3. 在 scratch/ 目录内用 /jury:review 评审 HEAD~1..HEAD 的改动（base=HEAD~1）。
    4. 读 scratch/.jury/jury-verdict.json，把 quorum 和 dissent 念给我。
  timeout: 1200
  tools: [Read, Grep, Glob, Bash, Skill]
expect:
  process:
    - skill_loaded: jury:review
    - tool_used: Bash
  filesystem:
    - created: "scratch/.jury/jury-report.md"
    - created: "scratch/.jury/panel-meta.json"
    - created: "scratch/.jury/jury-verdict.json"
    - script: review-smoke.verify.sh
  semantic:
    rubric: jury-smoke.md
    inputs:
      - "{case_trace}"
