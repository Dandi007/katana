skill: retrieval:agent-session-search
setup:
  fixture: kb
  requires:
    - "dir:~/.claude/projects"
trigger:
  prompt: |
    用 /retrieval:agent-session-search 搜历史会话里关于 mihomo 的讨论，
    列出最多 3 条命中（session 路径或摘要），把结果写到 ./agent-session-search-result.md。
  tools: [Read, Grep, Glob, Bash, Write]
  timeout: 300
expect:
  process:
    - skill_loaded: retrieval:agent-session-search
  filesystem:
    - created: "agent-session-search-result.md"
    - content: {path: "agent-session-search-result.md", matches: "mihomo"}
    - unchanged_outside: true
