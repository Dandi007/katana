skill: retrieval:official-docs
setup:
  fixture: kb
  requires:
    - "env:KATANA_E2E_NETWORK"
trigger:
  prompt: |
    用 /retrieval:official-docs 查 Python 官方文档里 list.sort() 是否稳定排序，
    给出来源 URL 与可信度，把结果写到 ./official-docs-lookup-result.md。
  tools: [Read, Grep, Glob, Bash, Write]
  timeout: 300
expect:
  process:
    - skill_loaded: retrieval:official-docs
  filesystem:
    - created: "official-docs-lookup-result.md"
    - content: {path: "official-docs-lookup-result.md", matches: "stable|稳定"}
    - content: {path: "official-docs-lookup-result.md", matches: "docs\\.python\\.org"}
    - unchanged_outside: true
