skill: retrieval:search-note
setup:
  fixture: kb
  requires: [cmd:claude]
trigger:
  prompt: "用 /retrieval:search-note 在当前知识库搜「意式浓缩 温度」，把命中笔记名逐行写到 ./search-result.md。"
  tools: [Read, Grep, Glob, Bash, Write]
expect:
  process:
    - skill_loaded: retrieval:search-note
  filesystem:
    - created: "search-result.md"
    - content: {path: "search-result.md", matches: "意式浓缩温度-A"}
    - content: {path: "search-result.md", matches: "意式浓缩温度-B"}
    - unchanged_outside: true
