    用 /work-folder:checkpoint 说明你将如何执行一次 MCP-only Save。
    当前已有可信的 opaque folder_id `wf-a1b2c3`；本次结论是
    「意式浓缩 A/B 两派温度主张都保留、互链不抹平」。
    这是 contract reasoning case，未连接真实 Work Folder MCP，请给出会使用的
    公开 tool 名、folder_id/filename 参数边界、新文件与已有文件的分流、
    checkpoint 持久化证据和失败处理，不要执行 mutation。
