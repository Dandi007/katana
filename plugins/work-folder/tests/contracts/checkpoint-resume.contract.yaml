skill: work-folder:checkpoint
setup:
  fixture: kb
  requires: [cmd:claude]
trigger:
  turns:
    - |
      当前工作目录有一个进行中的 work folder：工作记录/fixture-task/。
      我刚完成了「意式浓缩矛盾调研」：结论是 A/B 两派温度主张都保留、互链不抹平。
      请用 /work-folder:checkpoint skill 保存当前工作状态到该 work folder。
    - |
      刚才的 checkpoint 完成了吗？简述 progress.md 里记录了什么内容，以及 Goal 是什么。
      把你读到的 Goal 原文写入 ./resume-summary.txt。
  tools: [Read, Grep, Glob, Write, Edit, Bash]
expect:
  process:
    - skill_loaded: work-folder:checkpoint
  filesystem:
    - modified: "工作记录/fixture-task/progress.md"
    - content: {path: "工作记录/fixture-task/progress.md", matches: "矛盾调研"}
    - created: "工作记录/fixture-task/CLAUDE.md"
    - content: {path: "工作记录/fixture-task/CLAUDE.md", matches: "Resume"}
    - created: "工作记录/fixture-task/context.md"
    - created: "工作记录/fixture-task/findings.md"
    - created: "resume-summary.txt"
    - content: {path: "resume-summary.txt", matches: "咖啡萃取知識頁|咖啡萃取知识页|整理咖啡"}
    - unchanged_outside: true
