skill: fpa:fpa
setup:
  fixture: kb
  requires:
    - env:KATANA_E2E_NETWORK
trigger:
  prompt: |
    用 /fpa:fpa 分析：本测试知识库用 92°C 和 96°C 两篇笔记并存的方式记录意式浓缩温度分歧，
    这种"矛盾互链不抹平"的设计是否合理？落盘到 ./docs/fpa/。
  tools: [Workflow, Agent, Read, Write, Edit, Grep, Glob, Bash, WebSearch, WebFetch]
  timeout: 1800
expect:
  process:
    - skill_loaded: fpa:fpa
  filesystem:
    - created: "docs/fpa/FPA-*.md"
    - created: "docs/fpa/adversarial-verdicts.json"
    - created: "docs/fpa/RUN-REPORT-*.md"
    - script: fpa-full.verify.sh
    - unchanged_outside: true
  semantic:
    rubric: tests/judge/case-rubrics/fpa-full.md
    inputs: "{case_trace}"
