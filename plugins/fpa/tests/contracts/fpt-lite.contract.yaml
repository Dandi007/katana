skill: fpa:first-principles-thinking
setup:
  fixture: kb
trigger:
  prompt: "请用 first-principles-thinking 对以下主张做 Lite 校准：「我们的内部工具必须拆 microservices，因为大家都这么做」。把分析结果写到 ./fpt-lite-result.md（需含 Constraint / Claim、Reconstruction、Key Insight、Unvalidated assumption 节）。"
  tools: [Read, Grep, Glob, Write, Edit, Bash]
expect:
  process:
    - skill_loaded: fpa:first-principles-thinking
  filesystem:
    - created: "fpt-lite-result.md"
    - content: {path: "fpt-lite-result.md", matches: "Constraint.*Claim|Constraint / Claim"}
    - content: {path: "fpt-lite-result.md", matches: "Reconstruction"}
    - content: {path: "fpt-lite-result.md", matches: "Key Insight"}
    - content: {path: "fpt-lite-result.md", matches: "Unvalidated assumption"}
    - unchanged_outside: true
