skill: guide:using-katana
setup:
  fixture: kb
trigger:
  prompt: "根据本 session 已注入的 katana 约定，work folder 有哪些控制文件、checkpoint 应在什么时机做。把回答写到 ./katana-guide-answer.md。"
  tools: [Read, Grep, Glob, Write, Edit, Bash]
expect:
  process:
    - skill_loaded: guide:using-katana
  filesystem:
    - created: "katana-guide-answer.md"
    - content: {path: "katana-guide-answer.md", matches: "golden-order"}
    - content: {path: "katana-guide-answer.md", matches: "checkpoint"}
    - content: {path: "katana-guide-answer.md", matches: "work.folder|work folder"}
    - unchanged_outside: true
