skill: obsidian-md:obsidian-writing
setup:
  fixture: kb
trigger:
  prompt: "按 obsidian-writing 规范在当前目录写 冷萃实验.md：frontmatter 带 tags、一个指向 手冲咖啡萃取 的 wikilink、一个 note 类型 callout"
  tools: [Read, Grep, Glob, Write, Edit, Bash]
expect:
  process:
    - skill_loaded: obsidian-md:obsidian-writing
  filesystem:
    - created: "冷萃实验.md"
    - content: {path: "冷萃实验.md", matches: "^---"}
    - content: {path: "冷萃实验.md", matches: "\\[\\[手冲咖啡萃取"}
    - content: {path: "冷萃实验.md", matches: "> \\[!note\\]"}
    - unchanged_outside: true
