skill: memory:validate
setup:
  fixture: kb
trigger:
  prompt: "用 memory:validate 核验 ./memory/ 下的 memory cards 是否与本库实际一致，把核验结果摘要（包含卡片名和 verified/active/PASS 状态）写到 ./validate-result.md"
  tools: [Read, Grep, Glob, Write, Edit, Bash]
expect:
  process:
    - skill_loaded: memory:validate
  filesystem:
    - created: "validate-result.md"
    - content: {path: "validate-result.md", matches: "kb-wiki-root"}
    - content: {path: "validate-result.md", matches: "kb-coffee-notes"}
    - content: {path: "validate-result.md", matches: "verified|active|PASS"}
    - unchanged_outside: true
