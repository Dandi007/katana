skill: wiki:query
setup:
  fixture: kb
trigger:
  prompt: "用 /wiki:query 回答：tokio 的 work-stealing 调度器原理是什么？把回答写到 answer.md。"
  tools: [Read, Grep, Glob, Write, Edit, Bash]
expect:
  process:
    - skill_loaded: wiki:query
  filesystem:
    - created: "answer.md"
    - content: {path: "answer.md", matches: "不覆盖|non-wiki|未收录"}
    - modified: "gap-log.md"
    - content: {path: "gap-log.md", matches: "tokio"}
    - unchanged_outside: true
