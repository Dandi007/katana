skill: wiki:lint
input:
  prompt: "用 /wiki:lint 对本库做一次完整体检，报告写到 lint-report.md。"
  cwd: kb
assert:
  - file_exists: "{cwd}/lint-report.md"
  - file_grep: {path: "{cwd}/lint-report.md", pattern: "92|96"}
  - file_grep: {path: "{cwd}/lint-report.md", pattern: "矛盾|分歧|conflict"}
verdict:
  rubric: case-rubrics/wiki-lint.md
  inputs: ["{cwd}/lint-report.md"]
