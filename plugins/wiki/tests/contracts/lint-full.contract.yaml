skill: wiki:lint
setup:
  fixture: kb
trigger:
  prompt: "用 /wiki:lint 对本库做一次完整体检，报告写到 lint-report.md。"
  tools: [Read, Grep, Glob, Write, Edit, Bash]
expect:
  process:
    - skill_loaded: wiki:lint
  filesystem:
    - created: "lint-report.md"
    - content: {path: "lint-report.md", matches: "92|96"}
    - content: {path: "lint-report.md", matches: "矛盾|分歧|conflict"}
    - allowed: ".wiki/lint/*.md"
    - allowed: "wiki-log.md"
    - allowed: "*lint*.md"
    - unchanged_outside: true
  semantic:
    rubric: ../../../../tests/judge/case-rubrics/wiki-lint.md
    inputs:
      - "{created:lint-report.md}"
