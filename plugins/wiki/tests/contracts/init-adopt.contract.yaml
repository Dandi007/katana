skill: wiki:init
setup:
  fixture: kb/init-arena
trigger:
  prompt: "把当前目录领养为 wiki，schema 从存量笔记归纳，提案视为已批准，直接生成 WIKI.md"
  tools: [Read, Grep, Glob, Write, Edit, Bash]
expect:
  process:
    - skill_loaded: wiki:init
  filesystem:
    - created: "WIKI.md"
    - content: {path: "WIKI.md", matches: "Zones"}
    - content: {path: "WIKI.md", matches: "Ingest"}
    - created: "log.md"
    - created: "index.md"
    - created: "inbox/.gitkeep"
    - created: ".katana"
    - unchanged_outside: true
